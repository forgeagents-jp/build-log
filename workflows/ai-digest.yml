name: AI Digest

# 12:00 UTC = 7:00am Central during daylight saving (Mar-Nov).
# GitHub cron has no timezone support, so from November this fires at 6:00am
# Central until DST returns. Change to "0 13 * * *" in the winter if that matters.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

concurrency:
  group: ai-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post digest to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ai_digest.py --quiet
